include required(classpath("application"))

system {
  docker {
    hash-lookup {
      enabled = false
    }
  }
}

backend {
  default = "Local"

  providers {
    Local {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"

      config {
        root = "cromwell-executions"
        dockerRoot = "/cromwell-executions"

        # Safe for a laptop-sized Colima VM. Increase only when docker info
        # confirms enough memory for multiple simultaneous task containers.
        concurrent-job-limit = 1
        run-in-background = true

        # Cromwell itself uses POSIX FIFOs to stream task stdout/stderr.
        # Put those FIFOs on the container/host native /tmp filesystem rather
        # than a macOS-backed Docker bind mount.
        temporary-directory = "$(mktemp -d /tmp/cromwell.XXXXXX)"

        runtime-attributes = """
        String? docker
        Int cpu = 2
        Int memory_gb = 4
        String? disks
        """

        submit = """
        /usr/bin/env bash ${script}
        """

        submit-docker = """
        docker run --rm -i \
          --cidfile ${docker_cid} \
          --cpus ${cpu} \
          --memory ${memory_gb}g \
          --entrypoint ${job_shell} \
          -v ${cwd}:${docker_cwd} \
          -v /tmp:/tmp \
          -w ${docker_cwd} \
          ${docker} ${docker_script}
        """

        filesystems {
          local {
            localization: [
              "hard-link",
              "soft-link",
              "copy"
            ]
          }
        }
      }
    }
  }
}
